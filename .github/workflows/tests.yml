name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy scipy
      - name: Run tests
        run: python -m pytest -q
        env:
          SOLIDWRIGHT_WORDS: ${{ secrets.SOLIDWRIGHT_WORDS }}
