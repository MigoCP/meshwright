[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meshwright"
version = "0.1.0"
description = "Turn rough meshes into clean, verified solids for Rhino and Grasshopper."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=2.7"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "numpy", "scipy"]

[tool.setuptools.packages.find]
include = ["meshwright*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
